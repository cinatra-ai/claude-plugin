name: plugin-naming-gate

# Blocking naming gate for this pack's user-visible surface. The plugin is named
# `cinatra`, so Claude Code already namespaces everything it ships: a command
# reads `/cinatra:<command>` and a skill resolves as its bare name. Repeating the
# prefix inside an entry's own name would render as `/cinatra:cinatra-doctor`, and
# a name used twice within a kind is ambiguous at the `/cinatra:` prompt. The gate
# derives the names from the authoritative frontmatter (every `commands/*.md` and
# `skills/<dir>/SKILL.md` `name:`) rather than a hardcoded list, so it cannot go
# stale. See scripts/check-plugin-names.mjs for the rules and the --selftest that
# proves the gate can actually fail.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-naming-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pack
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Self-test the naming rules
        run: node scripts/check-plugin-names.mjs --selftest
      - name: Check command + skill names
        run: node scripts/check-plugin-names.mjs --list
