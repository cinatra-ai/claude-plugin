name: source-leak-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-leak-gate:
    uses: cinatra-ai/ci/.github/workflows/source-leak-gate.yml@00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e # v0.1.2-next.00ac7b9
    with:
      profile: default
      ratchet_mode: line
      # Scoped per-repo config: suppresses ONLY the GSD-product/path reference
      # (SLG_METHODOLOGY false-positive intrinsic to a GSD-parity pack — see the
      # _rationale in the config). Every other leak class stays fully active.
      config: .github/source-leak-config.json
      ref: 00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e
